name: Update TCGdex catalog
# Daily: fetches and validates TCGdex data and ECB rates, commits changes; github-pages.yml then publishes them.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-and-pages
  cancel-in-progress: false
jobs:
  update:
    if: github.repository_owner == '7ucardie'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Fetch and validate upstream catalog
        run: node scripts/sync-catalog.mjs
      - name: Measure which TCGdex card languages have a usable catalog
        run: node scripts/sync-languages.mjs
      - name: Fetch ECB exchange rates for price conversions
        run: node scripts/sync-rates.mjs
      - name: Check matching and update guards
        run: node scripts/check.mjs && node scripts/check-i18n.mjs && node scripts/check-sync.mjs && node scripts/check-syntax.mjs && node scripts/check-docs.mjs
      - name: Commit changed catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/data ios/Bindtopia/Resources
          if ! git diff --cached --quiet; then
            git commit -m 'Update TCGdex card catalog'
            git push
          fi
