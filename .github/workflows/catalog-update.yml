name: Update catalog and publish
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: catalog-and-pages
  cancel-in-progress: false
jobs:
  update:
    if: github.repository_owner == '7ucardie'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Fetch and validate upstream catalog
        run: node scripts/sync-catalog.mjs
      - name: Measure which TCGdex card languages have a usable catalog
        run: node scripts/sync-languages.mjs
      - name: Fetch ECB exchange rates for price conversions
        run: node scripts/sync-rates.mjs
      - name: Check matching and update guards
        run: node scripts/check.mjs && node scripts/check-i18n.mjs && node scripts/check-sync.mjs && node scripts/check-syntax.mjs && node scripts/check-docs.mjs
      - name: Commit changed catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/data ios/Bindtopia/Resources
          if ! git diff --cached --quiet; then
            git commit -m 'Update TCGdex card catalog'
            git push
          fi
      - name: Build the public JSON API
        if: vars.PAGES_ENABLED == 'true'
        run: node scripts/configure-project.mjs && node scripts/build-api.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: vars.PAGES_ENABLED == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: vars.PAGES_ENABLED == 'true'
        with:
          path: dist
      - name: Publish updated catalog
        if: vars.PAGES_ENABLED == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
