name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check dist/app.mjs && node scripts/check.mjs && node scripts/check-i18n.mjs && node scripts/check-sync.mjs && node scripts/check-docs.mjs
