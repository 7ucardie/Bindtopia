name: Publish catalog to GitHub Pages
# Publishes the site after CI passes on a push to main, or by hand (Run workflow).
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: catalog-and-pages
  cancel-in-progress: false
jobs:
  # Only a green CI run for a push to main in this repository, never a pull request or a fork; and only while the
  # tested commit is still the newest on main (a newer push publishes itself after its own CI).
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      publish: ${{ steps.newest.outputs.publish }}
    steps:
      - id: newest
        env:
          TESTED: ${{ github.event.workflow_run.head_sha }}
          NEWEST: ${{ github.sha }}
        run: |
          if [ -z "$TESTED" ] || [ "$TESTED" = "$NEWEST" ]; then echo "publish=true" >> "$GITHUB_OUTPUT"
          else echo "main moved on from $TESTED to $NEWEST; its own CI run publishes it"; echo "publish=false" >> "$GITHUB_OUTPUT"; fi
  deploy:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node scripts/check-syntax.mjs && node scripts/check.mjs && node scripts/check-i18n.mjs && node scripts/check-docs.mjs
      - run: node scripts/configure-project.mjs && node scripts/build-api.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
