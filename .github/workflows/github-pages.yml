name: Publish catalog to GitHub Pages
# Publishes the site after CI passes on a push to main, after the daily catalog update or the weekly fingerprint
# run committed new data, or by hand (Run workflow). This is the only workflow that publishes.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI, Update TCGdex catalog, Build card image fingerprints]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: catalog-and-pages
  cancel-in-progress: false
jobs:
  # Publishes only after a successful run in this repository: CI for a push to main (never a pull request or a fork),
  # or a data workflow on schedule or by hand.
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.name != 'CI' || github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CI: the tested commit must still be the newest on main (a newer push publishes itself after its own CI).
      # Data workflows: main must hold a new data commit by the workflow bot; without changes there is nothing to publish,
      # and a newer code commit on top waits for its own CI.
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ github.event.workflow_run.name }}
          STARTED: ${{ github.event.workflow_run.head_sha }}
          NEWEST: ${{ github.sha }}
        run: |
          author=$(git log -1 --format=%an)
          if [ "$EVENT" = workflow_dispatch ]; then publish=true
          elif [ "$SOURCE" = CI ]; then [ "$STARTED" = "$NEWEST" ] && publish=true || publish=false
          else [ "$STARTED" != "$NEWEST" ] && [ "$author" = 'github-actions[bot]' ] && publish=true || publish=false
          fi
          echo "$SOURCE${SOURCE:+: }started on $STARTED, main is $NEWEST by $author; publish=$publish"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
  deploy:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node scripts/check-syntax.mjs && node scripts/check.mjs && node scripts/check-i18n.mjs && node scripts/check-docs.mjs
      - run: node scripts/configure-project.mjs && node scripts/build-api.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
