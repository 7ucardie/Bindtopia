[package]
name = "emberfall"
version = "0.1.0"
edition = "2021"
description = "Emberfall – an original single-player fantasy MMO-style RPG vertical slice in Rust (macOS, Linux, Windows)"
license = "MIT"

[dependencies]
macroquad = { version = "0.4.16", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
